<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bird Profile | BirdIntelAI v2.8</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .species-shell{max-width:1200px;margin:0 auto;padding:20px}
    .species-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    .species-note{color:var(--muted);margin-top:8px}
    .species-actions{display:flex;gap:10px;flex-wrap:wrap}
    .species-actions a{display:inline-block;padding:11px 15px;border-radius:10px;background:#bfeee4;color:#17352f;text-decoration:none;font-weight:700}
    .profile-back-button{display:inline-block;padding:11px 15px;border-radius:10px;background:#bfeee4;color:#17352f;text-decoration:none;font-weight:700;margin-bottom:14px}
    .profile-grid{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(320px,1.35fr);gap:20px;margin-top:18px}
    .profile-panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel,#fff)}
    .bird-photo{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:10px;background:#f4f6f5}
    .photo-credit{font-size:.9rem;color:var(--muted);line-height:1.45;margin-top:10px}
    .photo-refresh{margin-top:10px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#bfeee4;color:#17352f;font-weight:700;cursor:pointer}
    .photo-credit a,.source-list a{color:inherit}
    .about-text{font-size:1.05rem;line-height:1.7;white-space:pre-line}
    .source-list{margin:10px 0 0;padding-left:20px}
    .loading{color:var(--muted)}
    .error-box{padding:12px;border:1px solid var(--line);border-radius:10px}
    .bird-chat-launch{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .bird-chat-launch button{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#bfeee4;color:#17352f;font-weight:700;cursor:pointer}
    .bird-chat{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .bird-chat-messages{max-height:420px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
    .bird-msg{display:flex;gap:8px;align-items:flex-start}.bird-msg.user{justify-content:flex-end}.bird-msg img{width:28px;height:28px;object-fit:contain;border-radius:50%}
    .bird-msg div{max-width:85%;padding:10px 12px;border-radius:11px;background:var(--panel-2);white-space:pre-wrap;line-height:1.5}.bird-msg.user div{background:#315647;color:#fff}
    .bird-chat-compose{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line)}.bird-chat-compose textarea{flex:1;resize:none}.bird-chat-compose button{padding:10px 14px}

    .about-heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .about-heading-row h2{margin-bottom:8px}
    .conservation-badge{display:inline-flex;align-items:center;padding:6px 11px;border-radius:999px;font-size:.86rem;font-weight:800;border:1px solid transparent}
    .conservation-low{background:#0f5a2a;color:#ffffff;border-color:#2f8a4c}
    .conservation-medium{background:#d2a900;color:#241c00;border-color:#f1cf3e}
    .conservation-high{background:#a61f1f;color:#ffffff;border-color:#d45a5a}
    .conservation-unknown{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
    .conservation-source{width:100%;margin:-5px 0 8px;text-align:right;font-size:.68rem;line-height:1.2;opacity:.58}
    .bird-info-section{padding:14px 0;border-top:1px solid var(--line)}
    .bird-info-section:first-child{border-top:0;padding-top:6px}
    .bird-info-section h3{margin:0 0 6px;font-size:1.02rem}
    .bird-info-section p{margin:0;line-height:1.65;white-space:pre-line}
    @media(max-width:760px){.profile-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="product-header">
    <div class="product-header-inner">
      <img class="product-title-image" src="/bird-intel-title.png" alt="WKH Bird Intel AI">
      <img class="owl-sketch" src="/owl-sketch-final.png" alt="Flying owl light sketch">
      <div class="page-title-block">
        <h2 class="page-title">Bird Profile</h2>
      </div>
    </div>
  </header>
  <main class="species-shell">
    <section class="card">
      <p><a class="profile-back-button" id="backToBirdIntelResults" href="/">← Back to Bird Intel Results</a></p>
      <div class="species-head">
        <div>
          <h1 id="commonName">Bird Profile</h1>
          <p id="scientificName" class="species-note"></p>
        </div>

      </div>

      <div class="profile-grid">
        <section class="profile-panel" aria-labelledby="photoHeading">
          <h2 id="photoHeading">Photo</h2>
          <div id="photoStatus" class="loading">Looking for an openly licensed image…</div>
          <img id="birdPhoto" class="bird-photo" alt="" hidden>
          <div id="photoCredit" class="photo-credit"></div>
          <button type="button" id="showAnotherPhoto" class="photo-refresh" hidden>Show another photo</button>
        </section>

        <section class="profile-panel" aria-labelledby="aboutHeading">
          <div class="about-heading-row"><h2 id="aboutHeading">About this bird</h2><span id="conservationBadge" class="conservation-badge" hidden></span></div>
          <div class="bird-chat-launch" id="birdChatLaunch" hidden><button type="button" id="toggleBirdChat">Ask WKH about this bird</button></div>
          <div id="aboutStatus" class="loading">Preparing bird information…</div>
          <div id="birdInfoSections" class="bird-info-sections"></div>
          <section id="birdChat" class="bird-chat" hidden>
            <div id="birdChatMessages" class="bird-chat-messages" aria-live="polite"><div class="bird-msg assistant"><img src="/wkh-logo.png" alt="WKH"><div id="birdChatHello">Ask me anything about this bird.</div></div></div>
            <div class="bird-chat-compose"><textarea id="birdChatInput" rows="2" placeholder="Ask about this bird..."></textarea><button type="button" id="sendBirdChat" class="primary-button">Send</button></div>
          </section>
        </section>
      </div>
    </section>
  </main>

  <footer class="species-shell">Firmware: BirdIntelAI_V11.8</footer>

  <script src="/bird_profile.js"></script>
  <script src="/bird_profile_info.js"></script>
</body>
</html>
